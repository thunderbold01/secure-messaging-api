<!DOCTYPE html>
<html>
<head>
    <title>Painel de Segurança - Haremessenger</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #dc2626, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #334155;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #10b981;
        }
        .stat-label {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 8px;
        }
        .section {
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            border: 1px solid #334155;
        }
        .section h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #f1f5f9;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .test-card {
            background: #0f172a;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #334155;
        }
        .test-card h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #06b6d4;
        }
        .test-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 12px;
        }
        .test-status.success {
            background: #10b98120;
            color: #10b981;
            border: 1px solid #10b98140;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
        }
        .table th, .table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        .table th {
            color: #94a3b8;
            font-weight: 500;
        }
        code {
            background: #0f172a;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 12px;
            color: #10b981;
        }
        .refresh-btn {
            background: linear-gradient(135deg, #dc2626, #06b6d4);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #334155;
            border-top-color: #06b6d4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Painel de Segurança</h1>
        <p class="subtitle">Monitoramento completo da infraestrutura criptográfica</p>
        
        <button class="refresh-btn" onclick="location.reload()">⟳ Atualizar Dados</button>
        
        <div id="content">
            <div class="loading"></div>
            <p style="margin-top: 10px;">Carregando dados do sistema...</p>
        </div>
    </div>

    <script>
        async function loadData() {
            const token = localStorage.getItem('token');
            
            try {
                // Carregar dados do dashboard
                const response = await fetch('/api/admin/security-dashboard/', {
                    headers: { 'Authorization': `Token ${token}` }
                });
                const data = await response.json();
                
                // Carregar certificados
                const certResponse = await fetch('/api/admin/certificados/', {
                    headers: { 'Authorization': `Token ${token}` }
                });
                const certData = await certResponse.json();
                
                renderDashboard(data, certData);
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="section" style="background: #7f1d1d;">
                        <h2>❌ Erro ao carregar dados</h2>
                        <p>Verifique se você está logado como administrador.</p>
                        <a href="/admin/" style="color: #06b6d4;">Ir para página de login</a>
                    </div>
                `;
            }
        }
        
        function renderDashboard(data, certData) {
            const html = `
                <!-- Estatísticas -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value">${data.resumo.total_usuarios}</div>
                        <div class="stat-label">Total de Usuários</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.resumo.usuarios_com_chave}</div>
                        <div class="stat-label">Usuários com Chave RSA</div>
                        <div style="font-size: 12px; color: #10b981;">${data.resumo.percentual_chaves}% do total</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.resumo.chaves_ativas}</div>
                        <div class="stat-label">Chaves Ativas</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${data.resumo.percentual_cifradas}%</div>
                        <div class="stat-label">Mensagens Criptografadas</div>
                        <div style="font-size: 12px;">${data.resumo.mensagens_cifradas} / ${data.resumo.mensagens_total}</div>
                    </div>
                </div>
                
                <!-- Testes de Algoritmos -->
                <div class="section">
                    <h2>🧪 Testes de Algoritmos</h2>
                    <div class="test-grid">
                        <div class="test-card">
                            <h3>🎲 PRNG 128 bits</h3>
                            <code>${data.testes.prng.bytes.substring(0, 32)}...</code>
                            <div class="test-status success">✅ Funcional - Entropia: ${data.testes.prng.entropy_source.algorithm}</div>
                        </div>
                        <div class="test-card">
                            <h3>🤝 Diffie-Hellman</h3>
                            <div>Primo: ${data.testes.diffie_hellman.prime_bits} bits</div>
                            <div>Gerador: g = ${data.testes.diffie_hellman.generator}</div>
                            <div class="test-status success">✅ Acordo de Chaves Funcional</div>
                        </div>
                        <div class="test-card">
                            <h3>🔐 Cifra Híbrida</h3>
                            <div>Algoritmo: ${data.testes.cifra_hibrida.algorithm || 'RSA + AES-256-CBC'}</div>
                            <div class="test-status success">✅ ${data.testes.cifra_hibrida.funcionou ? 'Funcional' : 'Erro'}</div>
                        </div>
                        <div class="test-card">
                            <h3>🔒 Hash SHA-256</h3>
                            <code>${data.testes.hash.sha256}...</code>
                            <div class="test-status success">✅ Integridade Disponível</div>
                        </div>
                    </div>
                </div>
                
                <!-- PKI e Certificados -->
                <div class="section">
                    <h2>🏛️ PKI - Infraestrutura de Chave Pública</h2>
                    <div style="margin-bottom: 20px;">
                        <h3>🔑 Autoridade Certificadora Raiz</h3>
                        <p><strong>Nome:</strong> ${certData.ca_raiz?.nome || 'SecureMessaging Root CA'}</p>
                        <p><strong>Status:</strong> <span style="color: #10b981;">✅ Ativa e Válida</span></p>
                        <p><strong>Validade:</strong> 10 anos</p>
                        <p><strong>Algoritmo:</strong> RSA-4096 com SHA-256</p>
                    </div>
                    
                    <h3>📜 Certificados Emitidos</h3>
                    <table class="table">
                        <thead>
                            <tr><th>Proprietário</th><th>Tipo</th><th>Status</th><th>Validade</th><th>Fingerprint</th></tr>
                        </thead>
                        <tbody>
                            ${certData.certificados?.map(cert => `
                                <tr>
                                    <td>${cert.usuario}</td>
                                    <td>${cert.tipo}</td>
                                    <td><span style="color: #10b981;">✅ ${cert.status}</span></td>
                                    <td>${new Date(cert.valido_ate).toLocaleDateString()}</td>
                                    <td><code>${cert.fingerprint}</code></td>
                                </tr>
                            `).join('') || '<tr><td colspan="5">Nenhum certificado emitido</td></tr>'}
                        </tbody>
                    </table>
                </div>
                
                <!-- Logs Recentes -->
                <div class="section">
                    <h2>📋 Logs de Segurança Recentes</h2>
                    <table class="table">
                        <thead>
                            <tr><th>Usuário</th><th>Operação</th><th>Algoritmo</th><th>Data/Hora</th></tr>
                        </thead>
                        <tbody>
                            ${data.logs_recentes?.map(log => `
                                <tr>
                                    <td>${log.usuario}</td>
                                    <td>${log.operacao}</td>
                                    <td><code>${log.algoritmo}</code></td>
                                    <td>${new Date(log.timestamp).toLocaleString()}</td>
                                </tr>
                            `).join('') || '<tr><td colspan="4">Nenhum log encontrado</td></tr>'}
                        </tbody>
                    </table>
                </div>
                
                <div class="section">
                    <h2>✅ Checklist de Requisitos do Enunciado</h2>
                    <table class="table">
                        <tr><td>✅</td><td><strong>RSA-1024</strong></td><td>Troca de chaves assimétrica</td><td>Funcional</td></tr>
                        <tr><td>✅</td><td><strong>Diffie-Hellman</strong></td><td>Acordo de chaves</td><td>Funcional</td></tr>
                        <tr><td>✅</td><td><strong>Cifra Híbrida</strong></td><td>RSA + AES-256</td><td>Funcional</td></tr>
                        <tr><td>✅</td><td><strong>SHA-256</strong></td><td>Integridade de mensagens</td><td>Funcional</td></tr>
                        <tr><td>✅</td><td><strong>PRNG 128 bits</strong></td><td>Números pseudoaleatórios</td><td>Funcional</td></tr>
                        <tr><td>✅</td><td><strong>PKI</strong></td><td>Certificados digitais e CA Raiz</td><td>Funcional</td></tr>
                    </table>
                </div>
            `;
            
            document.getElementById('content').innerHTML = html;
        }
        
        loadData();
    </script>
</body>
</html>
